version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build: .
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONIOENCODING=utf-8
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PATH=/usr/local/bin:/usr/bin:/bin
      - HOST_PROJECT_PATH=c:/code/shortform-platform
    volumes:
      - .:/app
      - ./temp:/app/temp
      - ./output:/app/output
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A worker.tasks.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONIOENCODING=utf-8
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PATH=/usr/local/bin:/usr/bin:/bin
      - HOST_PROJECT_PATH=c:/code/shortform-platform
    volumes:
      - .:/app
      - ./temp:/app/temp
      - ./output:/app/output
    depends_on:
      - redis
